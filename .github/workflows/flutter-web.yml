name: Flutter Web CI and Vercel Deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: "Deploy the tested Flutter Web build to a protected Vercel preview"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build Flutter Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo_easybooks
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Flutter on GitHub runner (no Xcode needed)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install locked dependencies
        run: flutter pub get

      - name: Test bookkeeping calculations
        run: flutter test

      - name: Build web release
        run: flutter build web --release --base-href "/"

      - name: Upload compiled website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: easybooks-flutter-web
          path: repo_easybooks/build/web/
          if-no-files-found: error
          retention-days: 7

  deploy_preview:
    name: Deploy prebuilt Flutter Web preview to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_preview && github.ref == 'refs/heads/main' }}
    environment: easybooks-preview
    env:
      VERCEL_ORG_ID: team_Vh6aHxefF7vYCxIl0brubyDU
      VERCEL_PROJECT_ID: prj_8w6vIiQaubQXbbgsSs2WusQF3Rzn
    steps:
      - name: Download successfully tested build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: easybooks-flutter-web
          path: web-dist/

      - name: Check preview deployment credential
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::error::GitHub Actions secret VERCEL_TOKEN is not set. See DEPLOYMENT.md."
            exit 1
          fi

      - name: Set up Node.js for Vercel CLI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.5.0

      - name: Link the existing EasyBooks Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview

      - name: Prepare static Build Output API payload
        shell: bash
        run: |
          mkdir -p .vercel/output/static
          cp -a web-dist/. .vercel/output/static/
          printf '{"version":3}\n' > .vercel/output/config.json
          test -s .vercel/output/static/index.html
          test -s .vercel/output/static/flutter_bootstrap.js
          test -s .vercel/output/static/main.dart.js

      - name: Create preview deployment (never production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --yes)"
          echo "Preview deployment: $deployment_url"
          echo "### EasyBooks Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
