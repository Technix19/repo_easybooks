name: Flutter Web CI and Vercel Deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy a verified Flutter Web build to Vercel production"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build Flutter Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo_easybooks
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter on GitHub runner (no Xcode needed)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install locked dependencies
        run: flutter pub get

      - name: Test bookkeeping calculations
        run: flutter test

      - name: Build web release
        run: flutter build web --release --base-href "/"

      - name: Upload compiled website
        uses: actions/upload-artifact@v4
        with:
          name: easybooks-flutter-web
          path: repo_easybooks/build/web/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy prebuilt web files to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production }}
    steps:
      - name: Download tested web artifact
        uses: actions/download-artifact@v4
        with:
          name: easybooks-flutter-web
          path: web-dist/

      - name: Create Vercel Build Output API directory
        shell: bash
        run: |
          mkdir -p .vercel/output/static
          cp -a web-dist/. .vercel/output/static/
          printf '{"version":3}\n' > .vercel/output/config.json
          test -s .vercel/output/static/index.html
          test -s .vercel/output/config.json

      - name: Verify Vercel deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name. See DEPLOYMENT.md."
              exit 1
            fi
          done

      - name: Set up Node.js for Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link to the existing Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy the prebuilt Flutter website
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
